<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Valentino Garcia, a software engineer creating thoughtful digital products and connected experiences."
    />
    <title>Valentino Garcia | Digital Product Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <section class="hero" id="top" aria-labelledby="hero-title">
        <div class="hero-art" aria-hidden="true">
          <img src="assets/abstract-ribbon.png" alt="" />
          <div class="hero-art-glow"></div>
        </div>

        <header class="site-header">
          <a class="brand" href="#top" aria-label="Valentino Garcia home">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>valentino</span>
          </a>

          <nav aria-label="Primary navigation">
            <a href="#work">Work</a>
            <a href="#about">About</a>
            <a href="mailto:your.email@example.com">Contact</a>
          </nav>

          <p class="availability"><span></span>Available for work</p>
        </header>

        <div class="hero-copy">
          <p class="eyebrow">Independent developer / London</p>
          <h1 id="hero-title">
            Digital products
            <span>with clarity and character.</span>
          </h1>
          <div class="hero-intro">
            <p>
              I’m Valentino, a software engineer building useful web products, AI tools, and connected experiences.
            </p>
            <a href="#work">View selected work <span aria-hidden="true">↗</span></a>
          </div>
        </div>

        <div class="hero-footer" aria-label="Portfolio information">
          <span>Portfolio / 2026</span>
          <span class="hero-line"></span>
          <a href="#work">Scroll to explore <span aria-hidden="true">↓</span></a>
        </div>
      </section>
    </main>
  </body>
</html>
